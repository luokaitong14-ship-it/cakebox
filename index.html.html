<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cakebox · 纸杯蛋糕礼物</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#2b2118;color:#fff6e8;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:860px;margin:auto;padding:28px 18px 70px}
.card{background:#ffffff14;border:1px solid #ffffff30;border-radius:24px;padding:26px;box-shadow:0 18px 60px #0008}
h1{font-size:clamp(28px,6vw,44px);margin:.2em 0}
h2{margin:.5em 0}
p{line-height:1.85}
.sub{opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:14px;opacity:.9;margin:12px 0 6px}
input,textarea{width:100%;border:1px solid #ffffff40;background:#00000030;color:#fff6e8;padding:12px 14px;border-radius:14px;font:inherit;outline:none}
textarea{min-height:90px;resize:vertical;line-height:1.7}
button{border:0;border-radius:999px;padding:13px 22px;margin:8px 8px 8px 0;background:#f2b8c6;color:#3a1f28;font-weight:800;font-size:16px;cursor:pointer}
button.alt{background:#fff0c9}
button.ghost{background:#ffffff12;color:#fff6e8;border:1px solid #ffffff30}
button:disabled{opacity:.45;cursor:default}
.tiny{font-size:13px;opacity:.65}
.stage{text-align:center}
.progress{height:12px;background:#ffffff20;border-radius:10px;overflow:hidden;margin:20px 0}
.bar{height:100%;width:0;background:#f2b8c6;transition:width .4s}
.cakebox{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}
@media(max-width:680px){.cakebox{grid-template-columns:1fr}}
.cake{border:1px solid #ffffff30;border-radius:20px;padding:18px;background:#ffffff10;text-align:center}
.cake .top{font-size:52px;line-height:1.2}
.cake .name{font-weight:800;margin:8px 0 4px}
.cake .deco{opacity:.85;min-height:1.5em}
.cake .inside{margin-top:12px;text-align:left;background:#fff8e8;color:#4b3028;border-radius:14px;padding:16px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.letter{background:#fff8e8;color:#4b3028;padding:26px;border-radius:12px;line-height:1.95;text-align:left;white-space:pre-wrap;word-break:break-word}
.linkbox{margin-top:16px;padding:14px;border-radius:14px;background:#00000030;border:1px solid #ffffff30;word-break:break-all;text-align:left}
.notice{background:#ffffff10;border:1px solid #ffffff30;border-radius:14px;padding:14px;margin:14px 0;text-align:left}
</style>
</head>
<body>
<main class="wrap"><section class="card" id="app"></section></main>
<script>
var app=document.getElementById('app');
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function clear(){app.replaceChildren()}
function button(text,fn,cls){var b=el('button',cls||'',text);b.type='button';b.onclick=fn;return b}
function field(labelText,value,type){
  var box=el('div');box.appendChild(el('label','',labelText));
  var node=type==='textarea'?el('textarea'):el('input');
  node.value=value||'';box.appendChild(node);return{box:box,node:node};
}
function val(s,max){s=(s||'').trim();return s.length>max?s.slice(0,max):s}
/* Gift link encoding: JSON -> UTF-8 -> base64url.
   This is the same generic technique Moonbox uses for its link
   (#gift= + base64url JSON). Cakebox keeps it, and adds the
   ?gift= form the request asks for. Both forms are read on open. */
function enc(o){
  var bytes=new TextEncoder().encode(JSON.stringify(o));var s='';
  bytes.forEach(function(x){s+=String.fromCharCode(x)});
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function dec(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4)s+='=';
  var bin=atob(s);
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,function(c){return c.charCodeAt(0)})));
}
function readGift(){
  var q=null;
  try{q=new URLSearchParams(location.search).get('gift')}catch(e){q=null}
  if(q){try{return dec(q)}catch(e){}}
  if(location.hash.indexOf('#gift=')===0){try{return dec(location.hash.slice(6))}catch(e){}}
  return null;
}
function defaultCakes(){
  return [
    {id:'cherry',name:'樱桃旋涡',top:'🍒',deco:'樱桃旋涡',filling:'草莓奶油',card:'你让我变的好幸福 我爱你哦 老公'},
    {id:'dots',name:'波点蜡烛',top:'🕯️',deco:'波点蜡烛',filling:'香草奶油',card:'点上蜡烛，许一个愿望给你。'},
    {id:'anniv',name:'纪念日裱花',top:'🎂',deco:'Happy 27th Anniversary',filling:'奶油裱花',card:'这是我们的纪念日蛋糕。'},
    {id:'mint',name:'薄荷告白',top:'💚',deco:'Love U Soooooo',filling:'薄荷奶油',card:'最后，再送你一个亲亲：mua～'}
  ];
}
function normalize(d){
  if(!d||typeof d!=='object')return null;
  var cakes=Array.isArray(d.cakes)&&d.cakes.length?d.cakes:defaultCakes();
  // Compatibility: an old Moonbox-style payload (letter/filling/mold)
  // still yields a readable gift instead of a blank page.
  if(!d.cakes&&d.letter){
    cakes=defaultCakes();
    cakes[0].card=d.letter;
    if(d.filling)cakes[0].filling=d.filling;
  }
  return {
    v:2,
    recipient:val(d.recipient,80),
    sender:val(d.sender,80),
    letter:val(d.letter,10000),
    cakes:cakes.slice(0,4).map(function(c){
      return {id:val(c.id,40),name:val(c.name,80),top:val(c.top,20),deco:val(c.deco,80),filling:val(c.filling,120),card:val(c.card,4000)};
    })
  };
}
function giftBase(){
  return location.origin+location.pathname;
}
function giftUrl(d){return giftBase()+'?gift='+enc(d)}

function maker(){
  clear();app.className='card';
  app.append(el('h1','','Cakebox · 纸杯蛋糕礼物'),el('p','sub','填好礼物信息，生成一条分享链接。收礼人打开链接后直接进入互动，不用重新填写。'));
  var g1=el('div','grid');
  var r=field('收礼人名字','River'),s=field('你的署名','舒与');
  g1.append(r.box,s.box);app.appendChild(g1);
  var l=field('给他的整封信（最后会完整出现）','你让我变的好幸福 我爱你哦 老公','textarea');
  app.appendChild(l.box);
  var cakeFields=defaultCakes().map(function(c){
    var h=el('h2','',c.name+' · '+c.deco);
    var f=field('内馅',c.filling),cd=field('蛋糕里藏的话',c.card,'textarea');
    var wrap=el('div');wrap.append(h,f.box,cd.box);return{wrap:wrap,filling:f,card:cd,base:c};
  });
  cakeFields.forEach(function(x){app.appendChild(x.wrap)});
  function collect(){
    var d={v:2,recipient:val(r.node.value,80),sender:val(s.node.value,80),letter:val(l.node.value,10000),
      cakes:cakeFields.map(function(x){return{id:x.base.id,name:x.base.name,top:x.base.top,deco:x.base.deco,filling:val(x.filling.node.value,120),card:val(x.card.node.value,4000)}})};
    if(!d.recipient||!d.letter){alert('请填写收礼人名字和整封信。');return null}
    return d;
  }
  app.appendChild(button('生成分享链接',function(){var d=collect();if(!d)return;generated(giftUrl(d),d)}));
  app.appendChild(button('预览收礼流程',function(){var d=collect();if(!d)return;recv(d,true)},'alt'));
  app.appendChild(el('p','tiny','链接里只包含你在这里填的内容，没有账号、没有数据库，打开链接即可运行。'));
}
function generated(url,d){
  clear();app.className='card';
  app.append(el('h1','','礼物链接已生成'),el('p','sub','把这条链接发给他，他在浏览器里打开后直接进入互动。'));
  var box=el('div','linkbox',url);app.appendChild(box);
  app.appendChild(button('复制链接',function(){try{navigator.clipboard.writeText(url);alert('已复制。')}catch(e){prompt('复制这个链接：',url)}}));
  app.appendChild(button('预览收礼流程',function(){recv(d,true)},'alt'));
  app.appendChild(button('返回修改',maker,'ghost'));
  var test=el('p','tiny','');var a=el('a','', '在新窗口打开这条链接测试');a.href=url;a.target='_blank';a.rel='noopener';test.appendChild(a);app.appendChild(test);
}

/* Recipient flow: every step is a real click, no hold-to-fill,
   so a browser (including an AI-driven browser) can drive it. */
var st={step:0,stir:0,pipe:0,opened:{}};
function recv(d,previewMode){
  d=normalize(d);if(!d){maker();return}
  clear();app.className='card stage';
  var who=d.recipient||'你';
  if(st.step===0){
    app.append(el('h1','',who+'，这里有一盒蛋糕给你'),el('p','sub','一共 '+d.cakes.length+' 个纸杯蛋糕，都是为他准备的。'));
    app.appendChild(button('开始做蛋糕',function(){st.step=1;recv(d,previewMode)}));
    if(previewMode)app.appendChild(button('返回填写',function(){st={step:0,stir:0,pipe:0,opened:{}};maker()},'ghost'));
    return;
  }
  if(st.step===1){
    app.append(el('h2','','第一步 · 搅拌面糊'),el('p','',st.stir<3?'点 3 下，把面糊搅顺滑。':'面糊顺滑了。'));
    var p=el('div','progress'),b=el('div','bar');b.style.width=(st.stir/3*100)+'%';p.appendChild(b);app.appendChild(p);
    app.appendChild(st.stir<3?button('搅一搅',function(){st.stir++;recv(d,previewMode)}):button('去挤奶油',function(){st.step=2;recv(d,previewMode)}));
    return;
  }
  if(st.step===2){
    app.append(el('h2','','第二步 · 挤奶油'),el('p','',st.pipe<3?'点 3 下，挤出三层奶油旋涡。':'三层奶油都挤好了。'));
    var p2=el('div','progress'),b2=el('div','bar');b2.style.width=(st.pipe/3*100)+'%';p2.appendChild(b2);app.appendChild(p2);
    app.appendChild(st.pipe<3?button('挤一层',function(){st.pipe++;recv(d,previewMode)}):button('点蜡烛',function(){st.step=3;recv(d,previewMode)}));
    return;
  }
  if(st.step===3){
    app.append(el('h2','','第三步 · 点蜡烛'),el('p','','点一下，蜡烛就亮了。'));
    app.appendChild(button('点蜡烛',function(){st.step=4;recv(d,previewMode)}));
    return;
  }
  if(st.step===4){
    app.append(el('h2','','第四步 · 吹蜡烛'),el('p','','点一下，把蜡烛吹灭。'));
    app.appendChild(button('吹灭蜡烛',function(){st.step=5;recv(d,previewMode)}));
    return;
  }
  if(st.step===5){
    app.append(el('h2','','选一个蛋糕，点开它'),el('p','sub','已打开 '+Object.keys(st.opened).length+' / '+d.cakes.length+' 个'));
    var box=el('div','cakebox');
    d.cakes.forEach(function(c){
      var card=el('div','cake');
      card.append(el('div','top',c.top||'🧁'),el('div','name',c.name),el('div','deco',c.deco));
      if(st.opened[c.id]){
        var inside=el('div','inside','内馅：'+c.filling+'\n'+c.card);card.appendChild(inside);
        card.appendChild(button('合上',function(){delete st.opened[c.id];recv(d,previewMode)},'ghost'));
      }else{
        card.appendChild(button('打开这个蛋糕',function(){st.opened[c.id]=true;recv(d,previewMode)}));
      }
      box.appendChild(card);
    });
    app.appendChild(box);
    app.appendChild(button('全部打开',function(){d.cakes.forEach(function(c){st.opened[c.id]=true});recv(d,previewMode)},'alt'));
    if(Object.keys(st.opened).length>=d.cakes.length){
      app.appendChild(button('看整封信',function(){st.step=6;recv(d,previewMode)}));
    }
    return;
  }
  if(st.step===6){
    var lt=el('div','letter');
    if(d.recipient)lt.appendChild(el('p','',d.recipient+'：'));
    lt.appendChild(el('p','',d.letter));
    if(d.sender)lt.appendChild(el('p','',d.sender));
    app.appendChild(lt);
    app.appendChild(button('再看一遍蛋糕',function(){st.step=5;recv(d,previewMode)},'ghost'));
    if(previewMode)app.appendChild(button('生成分享链接',function(){generated(giftUrl(d),d)},'alt'));
    return;
  }
}
var g=readGift();
if(g){st={step:0,stir:0,pipe:0,opened:{}};recv(g,false)}else maker();
</script>
</body></html>
